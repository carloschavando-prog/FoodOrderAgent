<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Inventory Sheet</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f5f3ec;--surface:#ffffff;--surface2:#edf6f6;--border:#c9d8d7;
      --text:#162b30;--muted:#64767a;--accent:#073f49;
      --green:#2f745d;--red:#a44737;--orange:#947b1f;
      --red-bg:#fae5df;--green-bg:#dcefe1;--teal-soft:#dceff1;
      --yellow-soft:#fff0ae;--yellow-border:#cba92b;--lavender-soft:#ead8ee;
      --shadow:0 8px 24px rgba(22,43,48,.08);
    }
    body{
      font-family:Inter,"Avenir Next","Segoe UI",Arial,sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;
    }

    /* ── Header ── */
    .app-header{
      position:sticky;top:0;z-index:50;
      background:var(--surface);border-bottom:1px solid var(--border);
      padding:11px 24px;min-height:72px;
      display:flex;align-items:center;justify-content:space-between;gap:20px;
      box-shadow:0 2px 12px rgba(22,43,48,.05);
    }
    .brand-lockup{display:flex;align-items:center;gap:12px;min-width:250px}
    .brand-mark{
      width:44px;height:44px;border-radius:4px;background:var(--accent);color:#fff;
      display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif;
      font-size:15px;font-weight:700;line-height:1;flex:0 0 auto;
    }
    .brand-copy{min-width:0}
    .brand-kicker{
      color:var(--muted);font-size:9px;font-weight:700;text-transform:uppercase;
      letter-spacing:0;line-height:1.2;margin-bottom:3px;
    }
    .app-header h1{
      font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:500;
      line-height:1.15;display:flex;align-items:baseline;gap:9px;white-space:nowrap;
    }
    .app-header h1 span{
      color:var(--muted);font-family:Inter,"Avenir Next","Segoe UI",Arial,sans-serif;
      font-weight:500;font-size:11px;
    }
    .header-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
    .btn{
      min-height:34px;padding:0 14px;border-radius:999px;
      border:1px solid var(--accent);background:var(--surface);
      color:var(--accent);font-size:12px;font-weight:700;
      cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      transition:background .15s,color .15s,border-color .15s;white-space:nowrap;
    }
    .btn:hover{background:var(--teal-soft);border-color:var(--accent)}
    .btn-primary,.btn-success{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn-primary:hover,.btn-success:hover{background:#0d5662;border-color:#0d5662}
    .btn-danger{background:var(--surface);border-color:#d5a9a0;color:var(--red)}
    .btn-danger:hover{background:var(--red-bg);border-color:var(--red)}
    .btn-success:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
    .btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
    /* ── Generate order spinner ── */
    .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);
      border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* ── Toast ── */
    .toast{
      position:fixed;bottom:24px;right:24px;z-index:200;
      background:var(--accent);color:#fff;padding:12px 20px;border-radius:8px;
      font-size:13px;font-weight:700;box-shadow:var(--shadow);
      display:none;align-items:center;gap:10px;
    }
    .toast.show{display:flex}
    .toast.error{background:var(--red)}

    /* ── Stats bar ── */
    .stats-bar{
      position:sticky;top:72px;z-index:40;background:var(--teal-soft);
      border-bottom:1px solid #bdd4d6;
      padding:9px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    }
    .stat{display:flex;align-items:center;gap:7px;font-size:12px}
    .stat-label{color:#496469;font-weight:600}
    .stat-value{font-weight:700}
    .stat-value.red{color:var(--red)}
    .stat-value.green{color:var(--green)}
    .pill{
      display:inline-flex;align-items:center;gap:4px;
      padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;
    }
    .pill-red{background:var(--yellow-soft);color:#765f09;border:1px solid #dec653}
    .pill-muted{background:rgba(255,255,255,.7);color:var(--muted);border:1px solid #bdd4d6}
    .vendor-pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

    /* ── Layout ── */
    .layout{display:flex;min-height:calc(100vh - 116px)}

    /* ── Sidebar ── */
    .sidebar{
      width:210px;flex-shrink:0;
      background:var(--surface);border-right:1px solid var(--border);
      padding:15px 10px;
      position:sticky;top:116px;
      height:calc(100vh - 116px);overflow-y:auto;
    }
    .sidebar-label{
      font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0;
      color:var(--muted);padding:4px 8px 9px;
    }
    .sidebar-item{
      display:flex;align-items:center;gap:8px;
      min-height:36px;padding:7px 9px;margin-bottom:3px;border-radius:6px;
      font-size:12px;font-weight:600;color:#50666a;
      cursor:pointer;transition:all .1s;
      border:1px solid transparent;text-decoration:none;
    }
    .sidebar-item:hover{color:var(--accent);background:var(--surface2)}
    .sidebar-item.active{color:var(--accent);border-color:#bfd7d9;background:var(--teal-soft)}
    .sidebar-item .s-icon{font-size:15px;flex-shrink:0}
    .sidebar-item .s-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sidebar-item .s-count{
      font-size:10px;font-weight:700;color:#765f09;
      background:var(--yellow-soft);padding:2px 6px;border-radius:999px;
      display:none;flex-shrink:0;
    }
    .sidebar-item .s-count.show{display:block}

    /* ── Content ── */
    .content{flex:1;padding:26px clamp(18px,2.5vw,36px) 48px;overflow-x:hidden}

    /* ── Category section ── */
    .cat-section{margin-bottom:34px;scroll-margin-top:130px}
    .cat-title{
      font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:500;
      text-transform:none;letter-spacing:0;color:var(--accent);
      margin-bottom:13px;padding-bottom:8px;border-bottom:1px solid #bfcfce;
      display:flex;align-items:center;gap:10px;
    }
    .cat-badge{
      font-family:Inter,"Avenir Next","Segoe UI",Arial,sans-serif;
      font-size:10px;font-weight:700;color:#765f09;
      background:var(--yellow-soft);padding:2px 8px;border-radius:999px;
      letter-spacing:0;display:none;
    }
    .cat-badge.show{display:inline-flex}

    /* ── Items grid ── */
    .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

    /* ── Item card ── */
    .item-card{
      position:relative;background:var(--surface2);border:1px solid #c7dada;
      border-top:4px solid var(--accent);border-radius:8px;padding:12px 14px 13px;
      box-shadow:0 3px 10px rgba(22,43,48,.04);
      transition:border-color .15s,background .15s;
    }
    .item-card.needs-order{
      border-color:#dcc75b;border-top-color:var(--yellow-border);background:var(--yellow-soft);
    }
    .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
    .item-name{font-size:13px;font-weight:700;line-height:1.3;color:var(--text)}
    .vendor-tag{
      display:none;font-size:9px;font-weight:700;color:var(--accent);background:rgba(255,255,255,.7);
      padding:3px 7px;border-radius:999px;white-space:nowrap;flex-shrink:0;
      border:1px solid #bed3d4;
    }
    .card-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:end}
    .field{display:flex;flex-direction:column;gap:3px}
    .field-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0;color:#65797d}
    .field-static{
      display:flex;align-items:baseline;gap:4px;white-space:nowrap;
      font-size:20px;font-weight:700;color:#4c666b;line-height:1.1;
    }
    .field-unit{font-size:11px;font-weight:700;color:#65797d}
    .order-qty{font-size:20px;font-weight:700;line-height:1.1}
    .order-qty.positive{color:var(--red)}
    .order-qty.zero{color:var(--green)}
    .order-qty.empty{color:var(--muted)}
    .field input[type=number]{
      width:100%;background:var(--surface);border:1px solid #afc7c9;
      border-radius:6px;color:var(--text);font-size:20px;font-weight:700;
      padding:4px 6px;text-align:center;outline:none;
      -moz-appearance:textfield;transition:border-color .15s;
    }
    .field input[type=number]::-webkit-outer-spin-button,
    .field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .field input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(7,63,73,.12)}
    .item-card.needs-order .field input[type=number]{border-color:#c4aa35}
    /* ── Vendor panel ── */
    .overlay{display:none;position:fixed;inset:0;background:rgba(22,43,48,.42);z-index:100}
    .overlay.open{display:block}
    .vendor-panel{
      position:fixed;top:0;right:-430px;bottom:0;width:430px;
      background:var(--surface);border-left:1px solid var(--border);
      z-index:101;overflow-y:auto;transition:right .25s ease;box-shadow:-12px 0 30px rgba(22,43,48,.14);
    }
    .vendor-panel.open{right:0}
    .panel-header{
      padding:18px 20px;border-bottom:1px solid #bdd4d6;
      display:flex;justify-content:space-between;align-items:center;
      position:sticky;top:0;background:var(--teal-soft);z-index:1;
    }
    .panel-header h2{font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:500;color:var(--accent)}
    .close-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;padding:0 4px}
    .close-btn:hover{color:var(--text)}
    .vendor-section{padding:14px 20px;border-bottom:1px solid var(--border)}
    .vendor-section h3{
      font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:500;
      text-transform:none;letter-spacing:0;color:var(--accent);margin-bottom:10px;
    }
    .vendor-section h3 em{color:var(--red);font-style:normal;margin-left:6px;font-size:12px}
    .vendor-row{
      display:flex;align-items:center;padding:7px 0;font-size:13px;
      border-bottom:1px solid #e1e8e7;
    }
    .vendor-row:last-child{border-bottom:none}
    .v-name{flex:1}
    .v-qty{font-weight:700;color:var(--red);margin-left:12px;font-size:15px;min-width:24px;text-align:right}
    .no-orders{padding:32px 20px;color:var(--muted);font-size:13px;text-align:center;line-height:1.6}

    /* ── Print ── */
    @media print{
      .app-header .header-actions,.stats-bar .vendor-pills,.sidebar,.overlay,.vendor-panel{display:none!important}
      .app-header{position:relative;height:auto;padding:12px 20px}
      .stats-bar{position:relative;top:auto}
      .layout{display:block}
      .content{padding:8px}
      .items-grid{grid-template-columns:repeat(4,1fr);gap:6px}
      .item-card{break-inside:avoid;border:1px solid #ccc;background:white;padding:8px}
      .item-card.needs-order{border-color:#c00;background:#fff5f5}
      body,.item-name,.vendor-tag{background:white;color:#111}
      .vendor-tag{background:#eee;color:#555;border-color:#ddd}
      .field-label{color:#666}
      .field-static{color:#333}
      .field-unit{color:#555}
      .order-qty.positive{color:#c00}
      .order-qty.zero{color:#090}
      .field input[type=number]{background:#f5f5f5;border-color:#ccc;color:#111}
      .cat-title{color:#444;border-color:#ccc}
    }

    @media (max-width:1100px){
      .app-header{align-items:flex-start}
      .header-actions{max-width:620px}
    }

    @media (max-width:800px){
      .app-header{position:relative;min-height:0;padding:11px 12px;align-items:stretch;flex-direction:column;gap:10px}
      .brand-lockup{min-width:0}
      .brand-mark{width:40px;height:40px}
      .app-header h1{width:100%;font-size:19px}
      .header-actions{width:100%;overflow-x:auto;padding-bottom:2px}
      .btn{min-height:34px;padding:0 11px;font-size:11px;flex:0 0 auto}
      .stats-bar{position:relative;top:auto;padding:9px 12px;gap:11px}
      .vendor-pills{width:100%;margin-left:0}
      .layout{display:block}
      .sidebar{
        position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--border);
        display:flex;overflow-x:auto;padding:8px 10px;gap:4px;
      }
      .sidebar-label{display:none}
      .sidebar-item{flex:0 0 auto;margin:0;padding:8px 10px}
      .content{padding:14px 12px}
      .items-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
      .vendor-panel{width:min(100vw,430px)}
    }

    @media (max-width:520px){
      .app-header h1{align-items:flex-start;flex-direction:column;gap:2px}
      .brand-kicker{font-size:8px}
      .items-grid{grid-template-columns:1fr}
      .toast{left:12px;right:12px;bottom:12px}
    }
  </style>
</head>

<header class="app-header">
  <div class="brand-lockup">
    <div class="brand-mark" aria-hidden="true">OPE</div>

    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-danger" onclick="resetAll()">↺ Reset</button>
    <button class="btn btn-success" id="saveSharedBtn" onclick="saveSharedSnapshot()">💾 Save Count</button>
    <button class="btn" id="loadSharedBtn" onclick="loadSharedSnapshot({force:true})">↧ Load Saved</button>
    <button class="btn" onclick="togglePanel()">📋 By Vendor</button>
    <button class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
    <button class="btn btn-success" id="generateBtn" onclick="generateOrder()" disabled title="Fill in all on-hand counts to enable">🚀 Generate Order</button>
  </div>
</header>

<div class="stats-bar">
  <div class="stat"><span class="stat-label">Need to Order</span><span class="stat-value red" id="needCount">–</span></div>
  <div class="stat"><span class="stat-label">Stocked</span><span class="stat-value green" id="stockedCount">–</span></div>
  <div class="stat"><span class="stat-label">Not Counted</span><span class="stat-value" id="uncountedCount">–</span></div>
  <div class="stat"><span class="stat-label">Shared Save</span><span class="stat-value" id="saveStatus">Checking…</span></div>
  <div class="vendor-pills" id="vendorPills"></div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="content"></main>
</div>

<div id="toast" class="toast"></div>
<div class="overlay" id="overlay" onclick="togglePanel()"></div>
<div class="vendor-panel" id="vendorPanel">

    <h2>Orders by Vendor</h2>

  </div>

</div>

// ── State ──────────────────────────────────────────────
const STATE_KEY = 'kitchen_order_v1';
let state = {};
let sectionObserver = null;

function loadState(){
  try{ const s = localStorage.getItem(STATE_KEY); if(s) state = JSON.parse(s); }catch(e){}
}
function saveState(){ try{ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }catch(e){} }
function getOnHand(id){ return state[id] !== undefined ? state[id] : ''; }
function normalizeName(name){ return String(name || '').toLowerCase().trim().replace(/\s+/g,' '); }
function hasLocalCounts(){ return Object.keys(state).length > 0; }
function setOnHand(id, val){
  if(val===''||val===null){ delete state[id]; } else { state[id]=parseFloat(val); }
  saveState();
  setSaveStatus('Unsaved changes');
}

function calcOrder(buildTo, raw){
  if(raw===''||raw===undefined||raw===null) return null;
  return Math.max(0, Math.ceil(buildTo - parseFloat(raw)));
}

function countUnitLabel(item){
  const unit=item.countUnit || 'case';
  return item.buildTo===1 || unit!=='case' ? unit : 'cases';
}

// ── Render sidebar ──────────────────────────────────────
function renderSidebar(){
  document.getElementById('sidebar').innerHTML =
    '<div class="sidebar-label">Sections</div>' +
    CATEGORIES.map(c=>`
      <a class="sidebar-item" href="#${c.id}">
        <span class="s-icon">${c.icon}</span>
        <span class="s-name">${c.name}</span>
        <span class="s-count" id="sc-${c.id}"></span>
      </a>`).join('');
}

// ── Render content ──────────────────────────────────────
function renderContent(){
  document.getElementById('content').innerHTML = CATEGORIES.map(cat=>`
    <section class="cat-section" id="${cat.id}">
      <div class="cat-title">
        ${cat.icon} ${cat.name}
        <span class="cat-badge" id="cb-${cat.id}"></span>
      </div>
      <div class="items-grid">${cat.items.map(renderCard).join('')}</div>
    </section>`).join('');
}

function renderCard(item){
  const oh = getOnHand(item.id);
  const qty = calcOrder(item.buildTo, oh);
  const needsOrder = qty !== null && qty > 0;
  const orderText = qty===null ? '–' : qty===0 ? '✓' : qty;
  const orderCls = qty===null ? 'empty' : qty===0 ? 'zero' : 'positive';
  return `
    <div class="item-card${needsOrder?' needs-order':''}" id="card-${item.id}">
      <div class="card-top">
        <div class="item-name">${item.name}</div>
        <div class="vendor-tag">${item.vendor}</div>
      </div>
      <div class="card-fields">
        <div class="field">
          <div class="field-label">PAR</div>
          <div class="field-static">
            ${item.buildTo}<span class="field-unit">${countUnitLabel(item)}</span>
          </div>
        </div>
        <div class="field">
          <div class="field-label">On Hand</div>
          <input type="number" min="0" step="0.5"
            value="${oh}"
            placeholder="–"
            oninput="updateItem(${item.id},this.value)"
            id="inp-${item.id}" />
        </div>
        <div class="field">
          <div class="field-label">Order</div>
          <div class="order-qty ${orderCls}" id="oq-${item.id}">${orderText}</div>
        </div>
      </div>
    </div>`;
}

// ── Live update ─────────────────────────────────────────
function updateItem(id, val){
  setOnHand(id, val==='' ? '' : val);
  let item;
  for(const cat of CATEGORIES){ item=cat.items.find(i=>i.id===id); if(item) break; }
  if(!item) return;

  const oh = val==='' ? '' : parseFloat(val);
  const qty = calcOrder(item.buildTo, oh);
  const needsOrder = qty!==null && qty>0;
  const orderText = qty===null ? '–' : qty===0 ? '✓' : qty;
  const orderCls  = qty===null ? 'empty' : qty===0 ? 'zero' : 'positive';

  document.getElementById(`oq-${id}`).textContent = orderText;
  document.getElementById(`oq-${id}`).className = `order-qty ${orderCls}`;
  document.getElementById(`card-${id}`).className = `item-card${needsOrder?' needs-order':''}`;
  updateStats();
}

// ── Stats ───────────────────────────────────────────────
function updateStats(){
  let need=0, stocked=0, uncounted=0;
  const vendorCounts={};

  for(const cat of CATEGORIES){
    let catNeed=0;
    for(const item of cat.items){
      const oh=getOnHand(item.id);
      if(oh===''||oh===undefined){ uncounted++; continue; }
      const qty=calcOrder(item.buildTo, oh);
      if(qty>0){
        need++; catNeed++;
        vendorCounts[item.vendor]=(vendorCounts[item.vendor]||0)+1;
      } else { stocked++; }
    }
    const sc=document.getElementById(`sc-${cat.id}`);
    const cb=document.getElementById(`cb-${cat.id}`);
    if(catNeed>0){
      sc.textContent=catNeed; sc.classList.add('show');
      cb.textContent=`${catNeed} to order`; cb.classList.add('show');
    } else {
      sc.classList.remove('show');
      cb.classList.remove('show');
    }
  }

  document.getElementById('needCount').textContent=need;
  document.getElementById('stockedCount').textContent=stocked;
  document.getElementById('uncountedCount').textContent=uncounted;

  // Enable "Generate Order" only when everything has been counted
  const genBtn = document.getElementById('generateBtn');
  if(uncounted === 0){
    genBtn.removeAttribute('disabled');
    genBtn.title = 'All items counted — click to generate the weekly order';
  } else {
    genBtn.setAttribute('disabled','');
    genBtn.title = `Fill in all on-hand counts first (${uncounted} remaining)`;
  }

  document.getElementById('vendorPills').innerHTML=
    Object.entries(vendorCounts)
      .sort((a,b)=>b[1]-a[1])
      .map(([v,c])=>`<span class="pill pill-red">${v} <strong>${c}</strong></span>`)
      .join('');
}

function setSaveStatus(text, isError=false){
  const el=document.getElementById('saveStatus');
  if(!el) return;
  el.textContent=text;
  el.className='stat-value'+(isError?' red':'');
}

function collectCountRows(){
  const rows=[];
  for(const cat of CATEGORIES){
    for(const item of cat.items){
      const oh=getOnHand(item.id);
      if(oh!=='' && oh!==undefined && oh!==null){
        rows.push({
          id:item.id,
          name:item.name,
          category:cat.name,
          unit:item.unit || 'case',
          on_hand:parseFloat(oh),
        });
      }
    }
  }
  return rows;
}

async function saveSharedSnapshot(){
  const btn=document.getElementById('saveSharedBtn');
  const rows=collectCountRows();
  if(!rows.length){
    showToast('Nothing to save yet.', true, 5000);
    return;
  }

  btn.textContent='Saving…';
  btn.setAttribute('disabled','');
  setSaveStatus('Saving…');

  try{
    const resp=await fetch('/api/inventory_snapshot',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        notes:'Saved from Kitchen Inventory Sheet',
        items:rows,
      }),
    });
    const data=await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(data.error || resp.statusText);

    const when=data.snapshot && data.snapshot.taken_at
      ? new Date(data.snapshot.taken_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})
      : 'now';
    setSaveStatus(`Saved ${when}`);
    showToast(`Saved ${data.saved_count || rows.length} counts to shared inventory.`);
  }catch(e){
    setSaveStatus('Save failed', true);
    showToast('Save failed: '+e.message, true, 8000);
  }

  btn.textContent='💾 Save Count';
  btn.removeAttribute('disabled');
}

async function loadSharedSnapshot(opts={}){
  const force=!!opts.force;
  const btn=document.getElementById('loadSharedBtn');
  if(btn) btn.setAttribute('disabled','');
  if(force) setSaveStatus('Loading…');

  try{
    const resp=await fetch('/api/inventory_snapshot');
    const data=await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(data.error || resp.statusText);
    if(!data.snapshot){
      setSaveStatus('No shared count');
      return;
    }

    const when=data.snapshot.taken_at
      ? new Date(data.snapshot.taken_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})
      : 'available';

    if(!force && hasLocalCounts()){
      setSaveStatus(`Saved ${when}`);
      return;
    }

    const counts=data.counts || {};
    const byName={};
    Object.keys(counts).forEach(name=>{ byName[normalizeName(name)]=counts[name]; });

    const nextState={};
    for(const cat of CATEGORIES){
      for(const item of cat.items){
        const val=byName[normalizeName(item.name)];
        if(val!==undefined && val!==null && val!==''){
          nextState[item.id]=parseFloat(val);
        }
      }
    }

    state=nextState;
    saveState();
    renderContent();
    updateStats();
    observeSections();
    setSaveStatus(`Loaded ${when}`);
    if(force) showToast('Loaded the latest shared inventory count.');
  }catch(e){
    setSaveStatus('Load failed', true);
    if(force) showToast('Load failed: '+e.message, true, 8000);
  }finally{
    if(btn) btn.removeAttribute('disabled');
  }
}

// ── Vendor panel ────────────────────────────────────────
function togglePanel(){
  const panel=document.getElementById('vendorPanel');
  const overlay=document.getElementById('overlay');
  const opening=!panel.classList.contains('open');
  if(opening) buildVendorPanel();
  panel.classList.toggle('open',opening);
  overlay.classList.toggle('open',opening);
}

function buildVendorPanel(){
  const vendorMap={};
  for(const cat of CATEGORIES){
    for(const item of cat.items){
      const oh=getOnHand(item.id);
      if(oh===''||oh===undefined) continue;
      const qty=calcOrder(item.buildTo, oh);
      if(qty>0){
        if(!vendorMap[item.vendor]) vendorMap[item.vendor]=[];
        vendorMap[item.vendor].push({...item, orderQty:qty});
      }
    }
  }
  const vendors=Object.keys(vendorMap).sort();
  const body=document.getElementById('vendorPanelBody');
  if(!vendors.length){
    body.innerHTML='<div class="no-orders">No items to order yet.<br>Enter on-hand counts to generate your order list.</div>';
    return;
  }
  body.innerHTML=vendors.map(v=>`
    <div class="vendor-section">
      <h3>${v}<em>${vendorMap[v].length} item${vendorMap[v].length>1?'s':''}</em></h3>
      ${vendorMap[v].map(item=>`
        <div class="vendor-row">
          <span class="v-name">${item.name}</span>
          <span class="v-qty">${item.orderQty}</span>
        </div>`).join('')}
    </div>`).join('');
}

// ── Reset ───────────────────────────────────────────────
function resetAll(){
  if(!confirm('Clear all on-hand counts and start over?')) return;
  state={};
  saveState();
  for(const cat of CATEGORIES){
    for(const item of cat.items){
      const inp=document.getElementById(`inp-${item.id}`);
      if(inp) inp.value='';
      const oq=document.getElementById(`oq-${item.id}`);
      if(oq){ oq.textContent='–'; oq.className='order-qty empty'; }
      const card=document.getElementById(`card-${item.id}`);
      if(card) card.className='item-card';
    }
  }
  updateStats();
}

// ── Generate Order trigger ──────────────────────────────
// POSTs on-hand counts to /api/generate_order (Vercel serverless).
// The API returns the complete order HTML which is opened in a new tab.

function showToast(msg, isError=false, duration=5000){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show'+(isError?' error':'');
  setTimeout(()=>t.classList.remove('show'), duration);
}

async function generateOrder(){
  const btn = document.getElementById('generateBtn');

  // Collect on-hand counts: {itemName: onHandValue}
  const counts = {};
  for(const cat of CATEGORIES){
    for(const item of cat.items){
      const oh = getOnHand(item.id);
      if(oh !== '' && oh !== undefined && oh !== null){
        counts[item.name] = parseFloat(oh);
      }
    }
  }

  // Show spinner
  btn.innerHTML = '<span class="spin"></span> Generating…';
  btn.setAttribute('disabled','');

  try {
    const resp = await fetch('/api/generate_order', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(counts),
    });

    if(!resp.ok){
      const err = await resp.json().catch(()=>({error:'Unknown server error'}));
      showToast('❌ Error: ' + (err.error || resp.statusText), true, 8000);
    } else {
      // API returns full HTML — open it in a new tab via Blob URL
      const html = await resp.text();
      const blob = new Blob([html], {type:'text/html;charset=utf-8'});
      const url  = URL.createObjectURL(blob);
      window.open(url, '_blank');
      showToast('✅ Weekly order generated!');
    }
  } catch(e) {
    showToast('❌ Request failed: ' + e.message, true, 8000);
  }

  // Restore button
  btn.innerHTML = '🚀 Generate Order';
  btn.removeAttribute('disabled');
}

// ── Init ────────────────────────────────────────────────
loadState();
renderSidebar();
renderContent();
updateStats();
loadSharedSnapshot();

document.getElementById('dateLabel').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

// Highlight active sidebar section on scroll
function observeSections(){
  if(sectionObserver) sectionObserver.disconnect();
  sectionObserver = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        document.querySelectorAll('.sidebar-item').forEach(el=>{
          el.classList.toggle('active', el.getAttribute('href')==='#'+e.target.id);
        });
      }
    });
  },{threshold:0.25,rootMargin:'-110px 0px -55% 0px'});
  document.querySelectorAll('.cat-section').forEach(el=>sectionObserver.observe(el));
}
observeSections();
